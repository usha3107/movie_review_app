{% extends "base.html" %}

{% block title %}Movie Reviews{% endblock %}

{% block content %}

<h2>Movie Reviews</h2>

<p>Write a review for each movie.</p>

<form method="POST">

    <div class="movie-grid">

        {% for movie in movies %}

        <div class="movie-card">

            <!-- Movie Poster -->
            <div class="poster-frame">

                <img
                    src="{{ url_for('static', filename='posters/' + movie.poster) }}"
                    alt="{{ movie.title }} poster"
                >

            </div>

            <!-- Movie Details -->
            <div class="movie-card-body">

                <h3>{{ movie.title }}</h3>

                <textarea
                    name="review_{{ movie.title.replace(' ', '_') }}"
                    placeholder="Write your review..."
                    required
                ></textarea>

            </div>

        </div>

        {% endfor %}

    </div>

    <!-- Submit Button -->
    <div class="submit-row">

        <button type="submit" class="btn">
            Submit Reviews
        </button>

    </div>

</form>

{% endblock %}
